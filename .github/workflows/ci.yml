name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests with coverage thresholds
        run: pnpm test:coverage

      - name: Check formatting of changed files
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tests i18n (symétrie FR/EN)
        run: pnpm check:i18n

      - name: Gouvernance CSS (ratchet strict)
        run: pnpm check:css
        env:
          STRICT: '1'

      - name: Dette de componentisation (ratchet strict)
        run: pnpm check:components
        env:
          STRICT: '1'

      - name: Modules orphelins (inventaire)
        run: pnpm check:dead-code

      - name: Tokens de couleur
        run: pnpm check:colors

      - name: Contraste WCAG des tokens
        run: pnpm check:contrast

      - name: Type-check Astro project (strict, fails on hints)
        run: pnpm check:strict

      - name: Build production site
        run: pnpm build

      - name: Bundle budget
        run: pnpm check:budget

      - name: Cohérence des langues dans le build
        run: pnpm check:i18n-build

      - name: Smoke-test critical routes
        run: pnpm test:smoke

      - name: Run browser E2E tests
        run: pnpm test:e2e
